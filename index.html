<style>
/* Layout : appli mobile une colonne, barre d'onglets en bas, couleurs des enveloppes = couleurs des billets en euros */
:root{
  --bg:#EEF2EF; --surface:#FFFFFF; --ink:#15201B; --muted:#5B6961; --line:#D6DED9; --soft:#E3EAE5;
  --accent:#0E7C5A; --accent-ink:#FFFFFF;
  --b5:#7A8A80; --b10:#C2483B; --b20:#3A6DB4; --b50:#D7822A; --b100:#2C8C5F; --b500:#8B78A8;
  --warn:#C2483B; --ok:#2C8C5F;
  --f-display:"Bricolage Grotesque", "Arial Rounded MT Bold", system-ui, sans-serif;
  --f-body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r:16px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0F1512; --surface:#18211C; --ink:#E6EEE9; --muted:#95A59C; --line:#2A3730; --soft:#202B25;
  --accent:#34B486; --accent-ink:#06150F;
  --b5:#9AAA9F; --b10:#E0695C; --b20:#6B98DA; --b50:#EBA055; --b100:#4DB585; --b500:#AC9AC9;
  --warn:#E0695C; --ok:#4DB585; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0F1512; --surface:#18211C; --ink:#E6EEE9; --muted:#95A59C; --line:#2A3730; --soft:#202B25;
  --accent:#34B486; --accent-ink:#06150F;
  --b5:#9AAA9F; --b10:#E0695C; --b20:#6B98DA; --b50:#EBA055; --b100:#4DB585; --b500:#AC9AC9;
  --warn:#E0695C; --ok:#4DB585; color-scheme:dark;
}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;font-variant-numeric:tabular-nums;-webkit-tap-highlight-color:transparent}
.wrap{max-width:520px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:14px 170px;display:flex;flex-direction:column;gap:14px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.top h1{font-size:22px;font-weight:800}
.top .m{color:var(--muted);font-weight:600;text-transform:capitalize}
.eyebrow{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.hero{background:var(--accent);color:var(--accent-ink);border:none}
.hero .eyebrow{color:inherit;opacity:.8}
.big{font-family:var(--f-display);font-weight:800;font-size:clamp(40px,13vw,56px);line-height:1}
.hero-row{display:flex;flex-wrap:wrap;gap:8px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;font-weight:600;font-size:13.5px;background:color-mix(in srgb, var(--accent-ink) 16%, transparent)}
.pill.neg{background:color-mix(in srgb, var(--warn) 85%, black 0%);color:#fff}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.row > :first-child{min-width:0}
.amt{font-weight:700;white-space:nowrap}
.muted{color:var(--muted)}
.small{font-size:13px}
.dot{width:10px;height:10px;border-radius:3px;flex:none;display:inline-block}
.lbl{display:flex;align-items:center;gap:8px;font-weight:600}
.stack{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--soft)}
.stack span{display:block;height:100%}
.gauge{height:8px;border-radius:4px;background:var(--soft);overflow:hidden}
.gauge i{display:block;height:100%;border-radius:4px}
.env{display:flex;flex-direction:column;gap:6px;padding-block:10px;border-top:1px solid var(--line)}
.env:first-of-type{border-top:none;padding-top:0}
.over{color:var(--warn);font-weight:600}
.carte{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center}
.carte .amt{font-family:var(--f-display);font-size:26px}
.btn{appearance:none;border:none;border-radius:12px;padding:12px 16px;font:600 15px var(--f-body);cursor:pointer;background:var(--accent);color:var(--accent-ink);text-align:center}
.btn.ghost{background:var(--soft);color:var(--ink)}
.btn.done{background:color-mix(in srgb, var(--ok) 16%, var(--surface));color:var(--ok)}
.btn.danger{background:color-mix(in srgb, var(--warn) 14%, var(--surface));color:var(--warn)}
.btn:focus-visible,input:focus-visible,select:focus-visible,.chip:focus-within,.tab:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.linkbtn{appearance:none;background:none;border:none;color:var(--accent);font:600 14px var(--f-body);padding:4px 0;cursor:pointer}
input[type=text],input[type=number],input[type=date],textarea{width:100%;font:500 16px var(--f-body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 12px}
textarea{min-height:90px;font-size:13px;font-family:ui-monospace,monospace}
.money-in{position:relative}
.money-in input{font:800 30px var(--f-display);padding-right:44px}
.money-in::after{content:"€";position:absolute;right:16px;top:50%;transform:translateY(-50%);font:800 24px var(--f-display);color:var(--muted)}
.banner{background:color-mix(in srgb, var(--b50) 16%, var(--surface));border:1px solid color-mix(in srgb, var(--b50) 45%, transparent);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.ordre{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:12px;background:color-mix(in srgb, var(--b100) 12%, var(--surface));border:1px solid color-mix(in srgb, var(--b100) 35%, transparent)}
.ordre b{font-family:var(--f-display);font-size:19px}
.list{display:flex;flex-direction:column}
.item{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding-block:10px;border-top:1px solid var(--line)}
.item:first-child{border-top:none}
.item .note{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.daytitle{font-weight:700;font-size:13px;color:var(--muted);text-transform:capitalize;padding-top:6px}
.del{appearance:none;border:none;background:none;color:var(--muted);font:600 13px var(--f-body);cursor:pointer;padding:4px 6px;border-radius:8px}
.del.arm{background:var(--warn);color:#fff}
.grid2{display:grid;grid-template-columns:1fr 92px auto;gap:8px;align-items:center}
.grid2 input{padding:9px 10px;font-size:15px}
.x{appearance:none;border:none;background:var(--soft);color:var(--muted);width:34px;height:34px;border-radius:9px;font-size:17px;cursor:pointer}
input[type=range]{width:100%;accent-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{position:relative}
.chip input{position:absolute;opacity:0;inset:0}
.chip span{display:inline-flex;align-items:center;gap:7px;padding:9px 13px;border-radius:999px;border:1.5px solid var(--line);font-weight:600;cursor:pointer}
.chip input:checked + span{border-color:var(--c);background:color-mix(in srgb, var(--c) 15%, var(--surface))}
.switch{display:flex;align-items:center;justify-content:space-between;gap:10px;font-weight:600}
.switch input{width:22px;height:22px;accent-color:var(--accent)}
.sync{font-size:12.5px;font-weight:600;color:var(--muted);margin-top:-8px}
.sync.ok,.sync.device{color:var(--ok)}
.sync.local,.sync.err{color:var(--warn)}
.obj{cursor:pointer}
.obj-cum{font-family:var(--f-display);font-size:24px}
.obj-pct{font-family:var(--f-display);font-weight:800;font-size:22px;color:var(--b100)}
.prog{position:relative;height:16px;border-radius:8px;background:var(--soft);overflow:hidden}
.prog i{display:block;height:100%;border-radius:8px;background:linear-gradient(90deg, color-mix(in srgb, var(--b100) 70%, var(--surface)), var(--b100))}
.prog span{position:absolute;top:3px;bottom:3px;width:2px;margin-left:-1px;background:color-mix(in srgb, var(--ink) 18%, transparent)}
.prog span.past{background:color-mix(in srgb, var(--surface) 60%, transparent)}
.rl{display:grid;grid-template-columns:1fr 96px auto auto;gap:8px;align-items:center;padding-block:10px;border-top:1px solid var(--line)}
.rl:first-child{border-top:none}
.rl input{padding:9px 10px;font-size:15px}
.tag{appearance:none;border:1.5px solid var(--line);background:none;color:var(--muted);border-radius:999px;padding:7px 10px;font:600 13px var(--f-body);cursor:pointer;white-space:nowrap}
.tag.on{border-color:var(--ok);color:var(--ok);background:color-mix(in srgb, var(--ok) 12%, var(--surface))}
.rt{display:flex;flex-direction:column;gap:8px;padding-block:10px;border-top:1px solid var(--line)}
.rt-opts{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.rt-opts .switch{justify-content:flex-start;font-weight:500}
select{font:500 15px var(--f-body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
/* barre d'onglets */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-left:max(10px, env(safe-area-inset-left, 0px));padding-right:max(10px, env(safe-area-inset-right, 0px));padding-top:6px;padding-bottom:calc(8px + env(safe-area-inset-bottom, 0px))}
.tabs .in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);align-items:center;gap:4px}
.tab{appearance:none;background:none;border:none;color:var(--muted);font:600 12px var(--f-body);display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;cursor:pointer;border-radius:10px}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--accent)}
.plus{appearance:none;border:none;width:58px;height:58px;border-radius:18px;background:var(--accent);color:var(--accent-ink);font:800 32px var(--f-display);position:fixed;z-index:25;right:max(max(16px, env(safe-area-inset-right, 0px)), calc(50vw - 244px));bottom:calc(78px + env(safe-area-inset-bottom, 0px));cursor:pointer;box-shadow:0 6px 18px color-mix(in srgb, var(--accent) 40%, transparent)}
/* feuille d'ajout */
.overlay{position:fixed;inset:0;z-index:30;background:color-mix(in srgb, #000 45%, transparent);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:520px;border-radius:22px 22px 0 0;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-top:18px;padding-bottom:calc(18px + env(safe-area-inset-bottom, 0px));display:flex;flex-direction:column;gap:14px;max-height:92vh;overflow:auto}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom, 0px));z-index:40;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600}
@media (prefers-reduced-motion: no-preference){ .sheet{animation:up .22s ease-out} @keyframes up{from{transform:translateY(30px);opacity:.6}} .gauge i,.stack span{transition:width .4s ease} }
</style>

<style>body{margin:0;font-size:14px}:root{padding-top:env(safe-area-inset-top,0px)}</style>
</head>
<body>
<div class="wrap" id="app"></div>

<nav class="tabs" aria-label="Navigation">
  <div class="in">
    <button class="tab" data-tab="mois" id="t-mois"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="15" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Mois</button>
    <button class="tab" data-tab="revenus" id="t-revenus"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v11M7 9l5 5 5-5"/><path d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg>Revenus</button>
    <button class="tab" data-tab="histo" id="t-histo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>Dépenses</button>
    <button class="tab" data-tab="objectif" id="t-objectif"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></svg>Objectif</button>
    <button class="tab" data-tab="reglages" id="t-reglages"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>Réglages</button>
  </div>
</nav>
<button class="plus" id="btn-plus" aria-label="Ajouter une dépense">+</button>

<div class="overlay" id="overlay" hidden></div>
<div class="toast" id="toast" hidden></div>

<script>
const KEY = "cap-epargne-v1";
const MOIS = ["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
const COLORS = ["var(--b20)","var(--b10)","var(--b5)","var(--b50)","var(--b500)","var(--b100)"];
const uid = () => Math.random().toString(36).slice(2,9);
const pad = n => String(n).padStart(2,"0");
const today = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
const monthKey = (iso) => iso.slice(0,7);
const fmtE = new Intl.NumberFormat("fr-FR",{style:"currency",currency:"EUR",minimumFractionDigits:0,maximumFractionDigits:2});
const eur = n => fmtE.format(Math.round(n*100)/100);
const num = v => { const n = parseFloat(String(v).replace(/\s/g,"").replace(",", ".")); return isFinite(n) ? n : 0; };
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function demoState(){
  const t = today(), mk = monthKey(t), [y,m,d] = t.split("-").map(Number);
  const day = n => `${mk}-${pad(Math.max(1, Math.min(n, d)))}`;
  return {
    demo: true,
    cfg: {
      fixes: [ {id:uid(),nom:"Loyer",montant:380},{id:uid(),nom:"Téléphone",montant:12},{id:uid(),nom:"Assurance",montant:35},{id:uid(),nom:"Abonnements",montant:15} ],
      epargnePct: 20,
      env: [ {id:"courses",nom:"Courses",pct:45},{id:"sorties",nom:"Sorties & loisirs",pct:25},{id:"perso",nom:"Perso & shopping",pct:15},{id:"imprevus",nom:"Imprévus",pct:15} ],
      objectif: { nom:"Matelas de sécurité", montant:2000 },
      deja: 300,
      revenus: defaultRevenus()
    },
    months: { [mk]: { salaire:1100, vire:false } },
    depenses: [
      {id:uid(),date:day(1),montant:52.4,cat:"courses",note:"Courses Lidl",carte:true},
      {id:uid(),date:day(2),montant:14,cat:"sorties",note:"Kebab + boisson",carte:true},
      {id:uid(),date:day(3),montant:9.9,cat:"perso",note:"Câble USB-C",carte:true},
      {id:uid(),date:day(4),montant:23,cat:"sorties",note:"Soirée BDE",carte:true},
      {id:uid(),date:day(5),montant:31.75,cat:"courses",note:"Carrefour City",carte:true},
      {id:uid(),date:day(d),montant:4.5,cat:"courses",note:"Boulangerie",carte:true}
    ]
  };
}
function defaultRevenus(){ return [
  {id:"salaire",nom:"Salaire",montant:1100,freq:"mensuel",mois:12,epargne:false,jour:""},
  {id:"apl",nom:"APL",montant:150,freq:"mensuel",mois:12,epargne:false,jour:5},
  {id:"pa",nom:"Prime d'activité",montant:0,freq:"mensuel",mois:12,epargne:false,jour:5}
]; }
function emptyState(){
  const cfg = demoState().cfg;
  cfg.fixes = [{id:uid(),nom:"Nouvelle charge",montant:0}];
  cfg.revenus.forEach(r=>r.montant = 0);
  cfg.objectif = { nom:"Mon objectif", montant:0 };
  cfg.deja = 0; cfg.m2 = true;
  return { demo:false, cfg, months:{}, depenses:[] };
}

let S;
try { S = JSON.parse(localStorage.getItem(KEY)); } catch(e) { S = null; }
if (!S || !S.cfg) S = demoState();
if (!S.cfg.envV2 && S.cfg.env.map(e=>e.id).join()==="courses,sorties,trajets,imprevus"){ S.cfg.env = JSON.parse('[{"id":"courses","nom":"Courses","pct":35},{"id":"sorties","nom":"Loisirs & shopping","pct":25},{"id":"trajets","nom":"Trajets","pct":25},{"id":"imprevus","nom":"Imprévus","pct":15}]'); S.cfg.envV2 = true; try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} }
if (!S.cfg.envV3 && S.cfg.env.some(e=>e.id==="perso") && S.cfg.env.some(e=>e.id==="sorties")){ const so = S.cfg.env.find(e=>e.id==="sorties"), pe = S.cfg.env.find(e=>e.id==="perso"); so.nom = "Loisirs & shopping"; so.pct = num(so.pct) + num(pe.pct); S.cfg.env = S.cfg.env.filter(e=>e.id!=="perso"); S.depenses.forEach(x=>{ if (x.cat==="perso") x.cat = "sorties"; }); S.cfg.envV3 = true; try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} }
if (!S.cfg.envV4 && S.months["2026-11"] && S.months["2026-11"].fixesOverride != null){ const pc = {courses:35, sorties:25, trajets:25, imprevus:15}; S.cfg.env.forEach(e=>{ if (pc[e.id] != null) e.pct = pc[e.id]; }); S.months["2026-11"].envOverride = {courses:40, trajets:40, sorties:10, imprevus:10}; S.cfg.envV4 = true; try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} }
if (!S.cfg.revenus) S.cfg.revenus = defaultRevenus();
if (!S.cfg.m2){
  S.cfg.revenus = S.cfg.revenus.filter(r=>r.id!=="13e");
  for (const r of S.cfg.revenus) if ((r.id==="apl"||r.id==="pa") && !r.jour) r.jour = 5;
  S.cfg.rembTotal = 0; S.cfg.rembParMois = 0; S.cfg.m2 = true;
}
for (const k in S.months){ const m = S.months[k]; if (!m.revenus){ m.revenus = [{id:uid(),src:null,nom:"Paie",montant:num(m.salaire),recu:true,edited:true,epargne:false}]; m.manuel = true; m.bonus = 0; } }
let cloudRef = null, cloudT = null, sync = "local";
function save(){
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){}
  if (cloudRef){ clearTimeout(cloudT); cloudT = setTimeout(cloudSave, 700); }
}
async function cloudSave(){
  if (!cloudRef) return;
  try { await cloudRef.set({ state: JSON.stringify(S), savedAt: new Date().toISOString() }); setSync("ok"); }
  catch(e){ setSync("err"); }
}
function syncLabel(){ return {ok:"✓ Sauvegardé sur ton compte", wait:"Connexion à ta sauvegarde…", err:"⚠ Sauvegarde en ligne indisponible", local:"⚠ Non sauvegardé : connecte-toi à Claude", device:"✓ Enregistré sur ce téléphone"}[sync]; }
function setSync(v){ sync = v; const el = document.getElementById("sync"); if (el){ el.textContent = syncLabel(); el.className = "sync " + v; } }

let tab = "mois", editPaie = false, armed = null;

/* ---------- calculs ---------- */
function plan(salaire, bonus=0){
  const c = S.cfg;
  const curM = S.months[monthKey(today())];
  const fixes = curM && curM.fixesOverride != null ? num(curM.fixesOverride) : c.fixes.reduce((a,f)=>a+num(f.montant),0);
  const base = Math.max(0, salaire - bonus);
  const epargne = (curM && curM.epOverride != null ? num(curM.epOverride) : (c.mode==="fixe" ? Math.min(num(c.epargneFixe), base) : Math.round(base * c.epargnePct / 100))) + bonus;
  const prov = provisions(), provTotal = prov.reduce((a,x)=>a+x.montant,0);
  const vivre = salaire - fixes - epargne - provTotal;
  const pctOf = e => curM && curM.envOverride && curM.envOverride[e.id] != null ? num(curM.envOverride[e.id]) : num(e.pct);
  const totPct = c.env.reduce((a,e)=>a+pctOf(e),0) || 1;
  const env = c.env.map((e,i)=>({ ...e, pct: pctOf(e), color: COLORS[i % COLORS.length], alloue: Math.max(0,vivre) * pctOf(e) / totPct }));
  const mk = monthKey(today()), cur = S.months[mk];
  const dejaCeMois = cur && cur.vire ? num(cur.remb) : 0;
  const remb = Math.max(0, Math.min(num(c.rembParMois), restantRemb() + dejaCeMois, epargne));
  return { salaire, fixes, epargne, vivre, env, remb, prov, provTotal };
}
/* ---------- projets (dépenses prévues) ---------- */
const mIndex = k => { const [y,m] = k.split("-").map(Number); return y*12 + m; };
function projets(){ return S.cfg.projets || (S.cfg.projets = []); }
function savedFor(pid){ let t = 0; for (const k in S.months){ const m = S.months[k]; if (m.vire && m.prov) t += num(m.prov[pid]); } return t; }
function spentFor(pid){ return S.depenses.filter(x=>x.cat==="proj-"+pid).reduce((a,x)=>a+num(x.montant),0); }
function provisions(){
  const mk = monthKey(today()), m = S.months[mk];
  if (!m || m.manuel) return [];
  if (m.vire && m.prov) return projets().map(p=>({id:p.id, nom:p.nom, montant:num(m.prov[p.id])})).filter(x=>x.montant>0);
  return projets().map(p=>{
    if (!p.date) return null;
    const n = mIndex(p.date) - mIndex(mk);
    const reste = Math.max(0, num(p.montant) - savedFor(p.id));
    return n > 0 && reste > 0 ? {id:p.id, nom:p.nom, montant:Math.ceil(reste / n)} : null;
  }).filter(Boolean);
}
function provFutur(p){
  const mk = monthKey(today()), m = S.months[mk];
  const n = mIndex(p.date||mk) - mIndex(mk) - (m && (m.manuel || m.vire) ? 1 : 0);
  const reste = Math.max(0, num(p.montant) - savedFor(p.id));
  return n > 0 ? Math.ceil(reste / n) : 0;
}
function restantRemb(){
  let r = num(S.cfg.rembTotal);
  for (const k in S.months){ const m = S.months[k]; if (m.vire) r -= num(m.remb); }
  return Math.max(0, r);
}
function epLabel(){ return S.cfg.mode==="fixe" ? "montant fixe" : S.cfg.epargnePct+" %"; }
function cumulEpargne(){
  let t = num(S.cfg.deja);
  for (const k in S.months){ const m = S.months[k]; if (m.vire) t += m.montant ?? Math.round(num(m.salaire) * (m.pct ?? S.cfg.epargnePct) / 100); }
  return t;
}
function colorOf(cat){ if (String(cat).startsWith("proj-") || cat==="deja") return "var(--muted)"; const i = S.cfg.env.findIndex(e=>e.id===cat); return i<0 ? "var(--b5)" : COLORS[i % COLORS.length]; }
function nameOf(cat){ if (cat==="deja") return "Dépensé avant l'appli"; if (String(cat).startsWith("proj-")){ const p = projets().find(x=>"proj-"+x.id===cat); return p ? "Projet · "+p.nom : "Projet"; } const e = S.cfg.env.find(e=>e.id===cat); return e ? e.nom : "Autre"; }

/* ---------- vues ---------- */
function header(){
  const [y,m] = today().split("-").map(Number);
  return `<div class="top"><h1>Cap Épargne</h1><span class="m">${MOIS[m-1]} ${y}</span></div><div id="sync" class="sync ${sync}">${syncLabel()}</div>` +
    (S.demo ? `<div class="banner"><div><b>Ce sont des chiffres d'exemple.</b> <span class="small">Mets ta vraie paie et tes charges fixes pour démarrer.</span></div><button class="btn" data-action="start">Commencer avec mes chiffres</button></div>` : "");
}

function viewMois(){
  const t = today(), mk = monthKey(t), mois = S.months[mk];
  const [y,m,d] = t.split("-").map(Number);
  if (!mois){ ensureMonth(mk); return viewMois(); }
  if (!num(mois.salaire)) return header() + `<section class="card"><div class="eyebrow">${MOIS[m-1]}</div><h2 style="font-size:22px">Entre tes revenus du mois</h2><p class="muted" style="margin:0">Salaire, APL, primes : je calcule ensuite ce que tu épargnes et ce que tu gardes pour chaque poste.</p><button class="btn" data-action="goRevenus">Mes revenus</button></section>`;
  if (editPaie){
    const val = mois ? mois.salaire : "";
    return header() + `
    <section class="card">
      <div class="eyebrow">Paie de ${MOIS[m-1]}</div>
      <h2 style="font-size:24px">Combien as-tu reçu ce mois-ci ?</h2>
      <label class="money-in"><input type="text" inputmode="decimal" id="in-paie" placeholder="0" value="${val}" aria-label="Montant reçu"></label>
      <div id="preview">${previewPlan(num(val))}</div>
      <button class="btn" data-action="validerPaie">Valider ma paie</button>
      ${mois ? `<button class="linkbtn" data-action="annulerPaie">Annuler</button>` : ""}
    </section>`;
  }
  const p = plan(num(mois.salaire), num(mois.bonus));
  const dejaAvant = S.depenses.filter(x=>x.cat==="deja" && monthKey(x.date)===mk).reduce((a,x)=>a+num(x.montant),0);
  if (dejaAvant){ const tp = p.env.reduce((a,e)=>a+num(e.pct),0) || 1; p.env.forEach(e=>e.alloue = Math.max(0, p.vivre - dejaAvant) * num(e.pct) / tp); }
  const dep = S.depenses.filter(x=>monthKey(x.date)===mk);
  const carteTout = dep.filter(x=>x.carte).reduce((a,x)=>a+num(x.montant),0);
  const depProj = dep.filter(x=>String(x.cat).startsWith("proj-"));
  const spent = dep.reduce((a,x)=>a+num(x.montant),0) - depProj.reduce((a,x)=>a+num(x.montant),0);
  const reste = p.vivre - spent;
  const dim = new Date(y, m, 0).getDate(), left = dim - d + 1;
  const avant = dep.filter(x=>x.date < t && !String(x.cat).startsWith("proj-")).reduce((a,x)=>a+num(x.montant),0);
  const auj = dep.filter(x=>x.date === t && !String(x.cat).startsWith("proj-")).reduce((a,x)=>a+num(x.montant),0);
  const quota = Math.max(0, (p.vivre - avant) / left);
  const resteJour = quota - auj;
  const carte = carteTout;
  const segs = [{v:p.fixes,c:"var(--b500)"},{v:p.epargne,c:"var(--b100)"},{v:p.provTotal,c:"var(--muted)"},...p.env.map(e=>({v:e.alloue,c:e.color}))];
  const tot = Math.max(1, segs.reduce((a,s)=>a+s.v,0));

  return header() + `
  <section class="card hero">
    <div class="eyebrow">Il te reste à dépenser ce mois</div>
    <div class="big">${eur(reste)}</div>
    <div class="hero-row">
      <span class="pill ${resteJour<0?"neg":""}">${resteJour>=0 ? `Aujourd'hui : encore ${eur(resteJour)}` : `Dépassé de ${eur(-resteJour)} aujourd'hui`}</span>
      <span class="pill">${left} jour${left>1?"s":""} restant${left>1?"s":""}</span>
    </div>
  </section>

  <section class="card carte">
    <div><div class="eyebrow">Encours carte · débit différé</div><div class="small muted">Prélevé en fin de mois. Cet argent est déjà dépensé.</div></div>
    <div class="amt">${eur(carte)}</div>
  </section>

  ${objCard(mois)}

  <section class="card">
    <div class="row"><div><div class="eyebrow">Tes revenus de ${MOIS[m-1]}</div><h2 style="font-size:22px">${eur(p.salaire)}</h2></div><button class="linkbtn" data-action="goRevenus">Modifier</button></div>
    <div class="small muted" style="margin-top:-6px">${mois.revenus.filter(l=>num(l.montant)).map(l=>`${esc(l.nom)} ${eur(num(l.montant))}${l.jour && !l.recu ? ` (le ${esc(l.jour)})` : ""}`).join(" · ")}</div>
    <div class="stack" role="img" aria-label="Répartition de la paie">${segs.map(s=>`<span style="width:${(Math.max(0,s.v)/tot*100).toFixed(2)}%;background:${s.c}"></span>`).join("")}</div>

    <div class="ordre">
      <span class="dot" style="background:var(--b100);margin-top:6px"></span>
      <div style="flex:1;display:flex;flex-direction:column;gap:8px">
        <div><div class="small muted">1. Épargne (${mois.epOverride != null ? "ajustée pour ce mois" : epLabel()}) — à faire en premier</div><b>Vire ${eur(p.epargne + p.provTotal)} sur ton livret</b>${p.provTotal>0 ? `<div class="small muted">${eur(p.epargne)} pour ton objectif + ${eur(p.provTotal)} mis de côté pour ${p.prov.map(x=>esc(x.nom)).join(", ")}</div>` : ""}${num(mois.bonus)>0 ? `<div class="small muted">dont ${eur(num(mois.bonus))} de primes envoyées directement à l'épargne</div>` : ""}</div>
        <button class="btn ${mois.vire?"done":""}" data-action="vire">${mois.vire ? "✓ Virement fait" : "C'est fait"}</button>
      </div>
    </div>

    <div class="row"><span class="lbl"><span class="dot" style="background:var(--b500)"></span>2. Charges fixes${mois.fixesOverride != null ? " (déjà payées ce mois-ci)" : ""}</span><span class="amt">${eur(p.fixes)}</span></div>
    <div class="small muted" style="margin-top:-6px">${S.cfg.fixes.map(f=>esc(f.nom)).join(" · ") || "Aucune charge renseignée"}</div>

    ${p.provTotal>0 ? `<div class="row"><span class="lbl"><span class="dot" style="background:var(--muted)"></span>Projets à venir</span><span class="amt">${eur(p.provTotal)}</span></div>` : ""}
    <div class="row"><span class="lbl">3. Pour vivre</span><span class="amt">${eur(p.vivre)}</span></div>
    ${p.vivre < 0 ? `<div class="over small">Ta paie ne couvre pas charges + épargne. Baisse le % d'épargne dans Réglages.</div>` : ""}
  </section>

  <section class="card">
    <div class="eyebrow">Tes enveloppes</div>
    ${p.env.map(e=>{
      const s = dep.filter(x=>x.cat===e.id).reduce((a,x)=>a+num(x.montant),0);
      const pct = e.alloue ? Math.min(100, s/e.alloue*100) : (s?100:0);

function previewPlan(sal){

/* ---------- revenus ---------- */
function applies(t, mn){ return t.freq !== "annuel" || Number(t.mois) === mn; }
function recalc(m){ m.salaire = m.revenus.reduce((a,l)=>a+num(l.montant),0); m.bonus = m.revenus.filter(l=>l.epargne).reduce((a,l)=>a+num(l.montant),0); }
function ensureMonth(mk){ if (!S.months[mk]){ S.months[mk] = {vire:false, revenus:[]}; syncMonth(mk); save(); } return S.months[mk]; }
function curMonth(){ return ensureMonth(monthKey(today())); }
function syncMonth(mk){
  const m = S.months[mk]; if (!m || m.manuel) return;
  const mn = Number(mk.slice(5)), tpls = S.cfg.revenus.filter(t=>applies(t, mn));
  m.revenus = m.revenus.filter(l => !l.src || l.recu || tpls.some(t=>t.id===l.src));
  for (const t of tpls){
    const l = m.revenus.find(x=>x.src===t.id);
    if (!l) m.revenus.push({id:uid(),src:t.id,nom:t.nom,montant:num(t.montant),recu:false,edited:false,epargne:!!t.epargne,jour:t.jour||""});
    else if (!l.recu){ l.nom = t.nom; l.epargne = !!t.epargne; l.jour = t.jour||""; if (!l.edited) l.montant = num(t.montant); }
  }
  recalc(m);
}
function viewRevenus(){
  const mk = monthKey(today()), mn = Number(mk.slice(5)), m = curMonth();
  const recu = m.revenus.filter(l=>l.recu).reduce((a,l)=>a+num(l.montant),0);
  const lines = m.revenus.map(l=>`<div class="rl">
      <div style="min-width:0">${l.src ? `<div style="font-weight:600">${esc(l.nom)}</div>` : `<input type="text" id="rl-n-${l.id}" data-rl="${l.id}" data-k="nom" value="${esc(l.nom)}" aria-label="Nom du revenu">`}
        ${l.jour && !l.recu ? `<div class="small muted">attendu le ${esc(l.jour)}</div>` : ""}
        ${l.src ? (l.epargne ? `<div class="small" style="color:var(--b100);font-weight:600">→ directement à l'épargne</div>` : "") : `<button class="tag ${l.epargne?"on":""}" style="margin-top:6px" data-action="eparl" data-id="${l.id}">${l.epargne ? "✓ Va à l'épargne" : "Envoyer à l'épargne"}</button>`}</div>
      <input type="text" inputmode="decimal" id="rl-m-${l.id}" data-rl="${l.id}" data-k="montant" value="${num(l.montant)||""}" placeholder="0" aria-label="Montant ${esc(l.nom)}">
      <button class="tag ${l.recu?"on":""}" data-action="recu" data-id="${l.id}">${l.recu ? "✓ Reçu" : "Prévu"}</button>
      ${l.src ? "" : `<button class="x" data-action="rmrl" data-id="${l.id}" aria-label="Retirer">×</button>`}
    </div>`).join("");
  const tpls = S.cfg.revenus.map(r=>`<div class="rt">
      <div class="grid2"><input type="text" id="rt-n-${r.id}" data-rt="${r.id}" data-k="nom" value="${esc(r.nom)}" aria-label="Nom"><input type="text" inputmode="decimal" id="rt-m-${r.id}" data-rt="${r.id}" data-k="montant" value="${num(r.montant)||""}" placeholder="0" aria-label="Montant habituel"><button class="x" data-action="rmrt" data-id="${r.id}" aria-label="Retirer">×</button></div>
      <div class="rt-opts">
        <select id="rt-f-${r.id}" data-rt="${r.id}" data-k="freq" aria-label="Fréquence"><option value="mensuel" ${r.freq!=="annuel"?"selected":""}>Chaque mois</option><option value="annuel" ${r.freq==="annuel"?"selected":""}>Une fois par an</option></select>
        ${r.freq==="annuel" ? `<select id="rt-mo-${r.id}" data-rt="${r.id}" data-k="mois" aria-label="Mois de versement">${MOIS.map((x,i)=>`<option value="${i+1}" ${Number(r.mois)===i+1?"selected":""}>en ${x}</option>`).join("")}</select>` : ""}
        <label class="small muted" style="display:flex;align-items:center;gap:6px">Versé le<input type="number" min="1" max="31" id="rt-j-${r.id}" data-rt="${r.id}" data-k="jour" value="${r.jour||""}" placeholder="–" style="width:64px;padding:7px 8px;font-size:15px"></label>
        <label class="switch small"><input type="checkbox" id="rt-e-${r.id}" data-rt="${r.id}" data-k="epargne" ${r.epargne?"checked":""}>Directement à l'épargne</label>
      </div></div>`).join("");
  return header() + `
  <section class="card">
    <div class="row"><div><div class="eyebrow">Revenus de ${MOIS[mn-1]}</div><h2 style="font-size:22px">${eur(num(m.salaire))}</h2></div><span class="small muted">${eur(recu)} reçus</span></div>
    ${m.manuel ? `<div class="small muted">Ce mois a été saisi à la main. Tes revenus habituels s'appliqueront automatiquement dès le mois prochain.</div>` : ""}
    <div class="list">${lines}</div>
    <button class="btn ghost" data-action="addrl">Ajouter un revenu ponctuel</button>
    <div class="small muted">Change un montant ici s'il est différent ce mois-ci. Touche « Prévu » quand l'argent arrive sur ton compte.</div>
  </section>

  <section class="card">
    <div class="eyebrow">Revenus habituels</div>
    <div class="small muted">Ils sont ajoutés tout seuls chaque mois, même s'ils arrivent après le 1er : l'appli compte dessus dès le début du mois.</div>
    ${tpls}
    <button class="btn ghost" data-action="addrt">Ajouter un revenu habituel</button>
  </section>

  <section class="card">
    <div class="eyebrow">Bon à savoir</div>
    <p style="margin:0"><b>Prime d'activité</b> : laisse-la à 0 tant que la CAF ne te l'a pas accordée, pour ne pas dépenser un argent qui n'est pas encore là. Ensuite, mets le montant notifié.</p>
    <p style="margin:0"><b>13e mois et primes</b> : ajoute-les en revenu ponctuel le mois où ils tombent, puis touche « Envoyer à l'épargne ». Toute la somme part sur ton livret, en plus de ton épargne habituelle, sans gonfler ton budget du mois.</p>
  </section>`;
}

function viewHisto(){
  const mk = monthKey(today()), [y,m] = mk.split("-").map(Number);
  const dep = S.depenses.filter(x=>monthKey(x.date)===mk).sort((a,b)=>b.date.localeCompare(a.date));
  const tot = dep.reduce((a,x)=>a+num(x.montant),0);
  let html = header() + `<section class="card"><div class="row"><div><div class="eyebrow">Dépenses de ${MOIS[m-1]}</div><h2 style="font-size:22px">${eur(tot)}</h2></div><span class="small muted">${dep.length} dépense${dep.length>1?"s":""}</span></div>`;
  if (!dep.length) return html + `<p class="muted">Rien pour l'instant. Touche + à chaque achat, ça prend 3 secondes.</p></section>`;
  let last = "";
  html += `<div class="list">`;
  for (const x of dep){
    if (x.date !== last){ last = x.date; const dt = new Date(x.date+"T12:00"); html += `<div class="daytitle">${dt.toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"})}</div>`; }
    html += `<div class="item"><span class="dot" style="background:${colorOf(x.cat)}"></span>
      <div class="note"><div style="font-weight:600" class="note">${esc(x.note || nameOf(x.cat))}</div><div class="small muted">${esc(nameOf(x.cat))}${x.carte?" · carte":" · autre"}</div></div>
      <div style="display:flex;align-items:center;gap:6px"><span class="amt">${eur(num(x.montant))}</span><button class="del ${armed===x.id?"arm":""}" data-action="del" data-id="${x.id}">${armed===x.id?"Supprimer":"✕"}</button></div></div>`;
  }
  return html + `</div></section>`;
}

function projetsCard(){
  const ps = projets(); if (!ps.length) return "";
  const mk = monthKey(today());
  return `<section class="card"><div class="row"><div class="eyebrow">Dépenses prévues</div><button class="linkbtn" data-action="goObjectif">Gérer</button></div>
    ${ps.map(p=>{
      const sv = savedFor(p.id), sp = spentFor(p.id), cible = num(p.montant), pct = cible ? Math.min(100, sv/cible*100) : 0;
      const quand = p.date ? `${MOIS[Number(p.date.slice(5))-1]} ${p.date.slice(0,4)}` : "date à choisir";
      const prov = provisions().find(x=>x.id===p.id);
      const statut = p.date && mIndex(p.date) <= mIndex(mk) ? `C'est ce mois-ci : tu as ${eur(sv)} de côté pour ça.` : prov ? `Ce mois-ci : ${eur(prov.montant)} à mettre de côté` : sv >= cible ? "Tout est mis de côté." : `${eur(provFutur(p))} par mois à partir du mois prochain`;
      return `<div class="env"><div class="row"><span class="lbl"><span class="dot" style="background:var(--muted)"></span>${esc(p.nom)}</span><span class="small muted">${quand}</span></div>
        <div class="gauge"><i style="width:${pct}%;background:var(--b100)"></i></div>
        <div class="small muted">${eur(sv)} de côté sur ${eur(cible)} · ${statut}${sp ? `<br>${eur(sp)} déjà payés, à reprendre sur ton livret.${sp > sv ? ` Tu as avancé ${eur(sp - sv)} : tes mises de côté des prochains mois le remettent sur le livret.` : ""}` : ""}</div></div>`;}).join("")}
  </section>`;
}
function objCard(mois){
  const o = S.cfg.objectif, cible = num(o.montant); if (!cible) return "";
  const cum = cumulEpargne(), pct = Math.min(100, cum/cible*100);
  let statut = "";
  if (o.date && cum < cible){
    const [ty,tm] = o.date.split("-").map(Number), [y,m] = today().split("-").map(Number);
    const n = (ty*12+tm) - (y*12+m) + (mois && !mois.vire ? 1 : 0);
    const parMois = mois ? plan(num(mois.salaire) - num(mois.bonus)).epargne : 0;
    if (n > 0){ const besoin = Math.ceil((cible-cum)/n);
      statut = !parMois ? `Il faut ${eur(besoin)} par mois jusqu'en ${MOIS[tm-1]} ${ty}.`
        : parMois >= besoin ? `<span style="color:var(--ok);font-weight:600">Dans les temps</span> · il faut ${eur(besoin)}/mois, tu en mets ${eur(parMois)}`
        : `<span class="over">En retard</span> · il faut ${eur(besoin)}/mois, tu en mets ${eur(parMois)}`; }
  }
  return `<section class="card obj" data-action="goObjectif" role="button" tabindex="0" aria-label="Voir l'objectif">
    <div class="row"><div><div class="eyebrow">Objectif · ${esc(o.nom)}</div><div><b class="obj-cum">${eur(cum)}</b> <span class="muted">/ ${eur(cible)}</span></div></div><span class="obj-pct">${Math.floor(pct)} %</span></div>
    ${progress(pct)}
    <div class="small muted">${cum >= cible ? "Objectif atteint, bravo." : `Encore ${eur(cible-cum)}${o.date ? ` avant ${MOIS[Number(o.date.slice(5))-1]} ${o.date.slice(0,4)}` : ""}.`} ${statut ? "<br>"+statut : ""}</div>
  </section>`;
}
function progress(pct){
  return `<div class="prog" role="progressbar" aria-valuenow="${Math.round(pct)}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pct}%"></i>${[25,50,75].map(t=>`<span style="left:${t}%" class="${pct>=t?"past":""}"></span>`).join("")}</div>`;
}
function echeance(reste, parMois, mois){
  const dt = S.cfg.objectif.date; if (!dt || reste <= 0) return "";
  const [ty,tm] = dt.split("-").map(Number), [y,m] = today().split("-").map(Number);
  const n = (ty*12+tm) - (y*12+m) + (mois && !mois.vire ? 1 : 0);
  const label = `${MOIS[tm-1]} ${ty}`;
  if (n <= 0) return `<div class="ordre" style="border-color:var(--warn)"><div>L'échéance (${label}) est passée. Choisis une nouvelle date dans Réglages.</div></div>`;
  const besoin = Math.ceil(reste / n);
  const ok = parMois >= besoin;
  return `<div class="ordre" style="${ok ? "" : "background:color-mix(in srgb, var(--b50) 14%, var(--surface));border-color:color-mix(in srgb, var(--b50) 45%, transparent)"}">
    <span class="dot" style="background:${ok ? "var(--b100)" : "var(--b50)"};margin-top:6px"></span>
    <div><div class="small muted">Échéance : ${label} · ${n} virement${n>1?"s":""} restant${n>1?"s":""}</div>
    <b>Il faut ${eur(besoin)} par mois</b>
    <div class="small">${!parMois ? "Ton épargne est à 0 ce mois-ci : la comparaison se fera avec ta prochaine paie." : ok ? `Avec ${eur(parMois)} par mois, tu es dans les temps.` : `Tu épargnes ${eur(parMois)} par mois : il manquera ${eur(besoin*n - parMois*n)}. Monte ton épargne à ${eur(besoin)} ou décale la date.`}</div></div>
  </div>`;
}
function viewObjectif(){
  const o = S.cfg.objectif, cum = cumulEpargne();
  const mk = monthKey(today()), mois = S.months[mk];
  const parMois = mois ? plan(num(mois.salaire) - num(mois.bonus)).epargne : 0;
  const reste = Math.max(0, num(o.montant) - cum);
  const pct = num(o.montant) ? Math.min(100, cum/num(o.montant)*100) : 0;
  const n = parMois ? Math.ceil(reste/parMois) : null;
  let fin = "";
  if (n){ const d = new Date(); d.setMonth(d.getMonth()+n); fin = `${MOIS[d.getMonth()]} ${d.getFullYear()}`; }
  const hist = Object.keys(S.months).sort().reverse().map(k=>{
    const mm = S.months[k], [yy,m2] = k.split("-").map(Number);
    const e = mm.montant ?? Math.round(num(mm.salaire) * (mm.pct ?? S.cfg.epargnePct) / 100);
    return `<div class="row" style="padding-block:6px;border-top:1px solid var(--line)"><span style="text-transform:capitalize">${MOIS[m2-1]} ${yy}</span><span class="${mm.vire?"":"muted"}">${mm.vire ? "+ "+eur(e) : "pas encore viré"}</span></div>`;
  }).join("");
  return header() + `

    ${progress(pct)}

    ${echeance(reste, parMois, mois)}
  </section>
  <section class="card">
    <div class="eyebrow">Dépenses prévues</div>
    <div class="small muted">Voyage, inscription à une course, entretien de la moto… Indique le coût estimé et le mois : l'appli calcule ce qu'il faut mettre de côté chaque mois, à part de ton objectif.</div>
    ${projets().map(p=>`<div class="rt">
      <div class="grid2"><input type="text" id="pj-n-${p.id}" data-pj="${p.id}" data-k="nom" value="${esc(p.nom)}" aria-label="Nom du projet"><input type="text" inputmode="decimal" id="pj-m-${p.id}" data-pj="${p.id}" data-k="montant" value="${num(p.montant)||""}" placeholder="0" aria-label="Coût estimé"><button class="x" data-action="rmpj" data-id="${p.id}" aria-label="Retirer">×</button></div>
      <label class="small muted" style="display:flex;align-items:center;gap:8px">Prévu en<input type="month" id="pj-d-${p.id}" data-pj="${p.id}" data-k="date" value="${esc(p.date||"")}" style="flex:1;font:500 15px var(--f-body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px"></label>
      <div class="small muted">${eur(savedFor(p.id))} déjà de côté${p.date && num(p.montant) ? ` · ${eur(provisions().find(x=>x.id===p.id)?.montant ?? provFutur(p))} par mois` : ""}</div>
    </div>`).join("")}
    <button class="btn ghost" data-action="addpj">Ajouter une dépense prévue</button>
  </section>

  <section class="card"><div class="eyebrow">Historique des virements</div><div>${hist || '<p class="muted">Aucun mois encore.</p>'}</div>
  <div class="small muted">Déjà épargné avant l'appli : ${eur(num(S.cfg.deja))}</div></section>`;
}

    <input type="text" id="ob-nom" value="${esc(c.objectif.nom)}" aria-label="Nom de l'objectif">
    <div class="grid2" style="grid-template-columns:1fr 1fr"><label class="small muted">Montant visé<input type="text" inputmode="decimal" id="ob-mt" value="${c.objectif.montant}"></label><label class="small muted">Déjà épargné<input type="text" inputmode="decimal" id="ob-deja" value="${c.deja}"></label></div>
    <label class="small muted">À atteindre avant<input type="month" id="ob-date" value="${esc(c.objectif.date||"")}" min="${monthKey(today())}" style="width:100%;font:500 16px var(--f-body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px"></label>
  </section>

  <section class="card">
    <div class="eyebrow">Sauvegarde</div>
    <div class="small muted">Tes données restent sur ce téléphone, dans ce navigateur. Copie une sauvegarde de temps en temps (dans tes notes par exemple).</div>
    <button class="btn ghost" data-action="copy">Copier ma sauvegarde</button>
    <textarea id="bk" placeholder="Colle ici une sauvegarde pour la restaurer"></textarea>
    <button class="btn ghost" data-action="restore">Restaurer</button>
    <button class="btn danger" data-action="reset" id="btn-reset">${armed==="reset" ? "Confirmer : tout effacer" : "Tout effacer"}</button>
  </section>`;
}

function render(){
  const v = {mois:viewMois, revenus:viewRevenus, histo:viewHisto, objectif:viewObjectif, reglages:viewReglages}[tab];
  document.getElementById("app").innerHTML = v();
  document.querySelectorAll(".tab").forEach(b=>b.setAttribute("aria-current", b.dataset.tab===tab ? "page" : "false"));
}

/* ---------- feuille d'ajout ---------- */
function openSheet(){
  const ov = document.getElementById("overlay");
  ov.innerHTML = `<form class="sheet" id="f-dep" role="dialog" aria-label="Nouvelle dépense">
    <div class="row"><h2 style="font-size:22px">Nouvelle dépense</h2><button type="button" class="x" data-action="close" aria-label="Fermer">×</button></div>
    <label class="money-in"><input type="text" inputmode="decimal" id="dep-mt" placeholder="0" aria-label="Montant" autocomplete="off"></label>
    <div class="chips" role="radiogroup" aria-label="Enveloppe">${S.cfg.env.map((e,i)=>`<label class="chip" style="--c:${COLORS[i%COLORS.length]}"><input type="radio" name="cat" value="${e.id}" ${i===0?"checked":""}><span><span class="dot" style="background:${COLORS[i%COLORS.length]}"></span>${esc(e.nom)}</span></label>`).join("")}${projets().filter(p=>!p.date || mIndex(p.date) >= mIndex(monthKey(today()))-1).map(p=>`<label class="chip" style="--c:var(--muted)"><input type="radio" name="cat" value="proj-${p.id}"><span><span class="dot" style="background:var(--muted)"></span>Projet · ${esc(p.nom)}</span></label>`).join("")}</div>
    <input type="text" id="dep-note" placeholder="Note (facultatif) : Lidl, ciné…" autocomplete="off">
    <div class="grid2" style="grid-template-columns:1fr 1fr"><label class="switch">Payé par carte<input type="checkbox" id="dep-carte" checked></label><input type="date" id="dep-date" value="${today()}" aria-label="Date"></div>
    <div class="small over" id="dep-err" hidden>Entre un montant.</div>
    <button class="btn" type="submit">Ajouter</button>
  </form>`;
  ov.hidden = false;
  setTimeout(()=>document.getElementById("dep-mt")?.focus(), 60);
}
function closeSheet(){ const ov = document.getElementById("overlay"); ov.hidden = true; ov.innerHTML = ""; }

let toastT;
function toast(msg){ const t = document.getElementById("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(()=>t.hidden = true, 2000); }

/* ---------- événements ---------- */
document.addEventListener("click", async (ev)=>{
  const tb = ev.target.closest(".tab"); if (tb){ tab = tb.dataset.tab; editPaie = false; armed = null; render(); window.scrollTo(0,0); return; }
  if (ev.target.closest("#btn-plus")){ openSheet(); return; }
  if (ev.target.id === "overlay"){ closeSheet(); return; }
  const a = ev.target.closest("[data-action]"); if (!a) return;
  const act = a.dataset.action, mk = monthKey(today());
  if (act !== "del" && act !== "reset") armed = null;
  switch(act){
    case "start": S = emptyState(); save(); tab = "reglages"; render(); toast("Entre tes charges fixes, puis tes revenus"); break;
    case "validerPaie": { const v = num(document.getElementById("in-paie").value); if (!v){ toast("Entre le montant reçu"); return; }
      S.months[mk] = { ...(S.months[mk]||{vire:false}), salaire:v, pct:S.cfg.epargnePct }; editPaie = false; save(); render(); toast("Paie enregistrée"); break; }
    case "editPaie": editPaie = true; render(); break;
    case "annulerPaie": editPaie = false; render(); break;
    case "vire": S.months[mk].vire = !S.months[mk].vire; S.months[mk].pct = S.cfg.epargnePct; { const pl = plan(num(S.months[mk].salaire), num(S.months[mk].bonus)); S.months[mk].montant = pl.epargne; S.months[mk].remb = S.months[mk].vire ? pl.remb : 0; S.months[mk].prov = S.months[mk].vire ? Object.fromEntries(pl.prov.map(x=>[x.id, x.montant])) : null; } save(); render(); if (S.months[mk].vire) toast("Bien joué, épargne sécurisée"); break;
    case "del": { const id = a.dataset.id; if (armed === id){ S.depenses = S.depenses.filter(x=>x.id!==id); armed = null; save(); } else armed = id; render(); break; }
    case "addfx": S.cfg.fixes.push({id:uid(),nom:"Nouvelle charge",montant:0}); save(); render(); break;
    case "rmfx": S.cfg.fixes = S.cfg.fixes.filter(f=>f.id!==a.dataset.id); save(); render(); break;
    case "adden": S.cfg.env.push({id:uid(),nom:"Nouvelle enveloppe",pct:0}); save(); render(); break;
    case "rmen": if (S.cfg.env.length>1){ S.cfg.env = S.cfg.env.filter(e=>e.id!==a.dataset.id); save(); render(); } break;
    case "copy": { const txt = JSON.stringify(S); try { await navigator.clipboard.writeText(txt); toast("Sauvegarde copiée"); } catch(e){ const bk = document.getElementById("bk"); bk.value = txt; bk.select(); toast("Sélectionnée : copie-la manuellement"); } break; }
    case "restore": { try { const d = JSON.parse(document.getElementById("bk").value); if (!d.cfg) throw 0; S = d; save(); render(); toast("Sauvegarde restaurée"); } catch(e){ toast("Sauvegarde illisible"); } break; }
    case "reset": if (armed === "reset"){ S = emptyState(); armed = null; save(); tab = "mois"; render(); toast("Tout est effacé"); } else { armed = "reset"; render(); } break;
    case "close": closeSheet(); break;
    case "addpj": projets().push({id:uid(), nom:"Voyage", montant:0, date:""}); save(); render(); break;
    case "rmpj": S.cfg.projets = projets().filter(x=>x.id!==a.dataset.id); save(); render(); break;
    case "goObjectif": tab = "objectif"; render(); window.scrollTo(0,0); break;
    case "goRevenus": tab = "revenus"; render(); window.scrollTo(0,0); break;
    case "recu": { const l = curMonth().revenus.find(x=>x.id===a.dataset.id); if (l){ l.recu = !l.recu; save(); render(); } break; }
    case "eparl": { const m2 = curMonth(), l = m2.revenus.find(x=>x.id===a.dataset.id); if (l){ l.epargne = !l.epargne; recalc(m2); save(); render(); } break; }
    case "addrl": { const m2 = curMonth(); m2.revenus.push({id:uid(),src:null,nom:"Revenu ponctuel",montant:0,recu:false,edited:true,epargne:false}); recalc(m2); save(); render(); break; }
    case "rmrl": { const m2 = curMonth(); m2.revenus = m2.revenus.filter(x=>x.id!==a.dataset.id); recalc(m2); save(); render(); break; }
    case "addrt": S.cfg.revenus.push({id:uid(),nom:"Nouveau revenu",montant:0,freq:"mensuel",mois:12,epargne:false}); syncMonth(mk); save(); render(); break;
    case "rmrt": S.cfg.revenus = S.cfg.revenus.filter(x=>x.id!==a.dataset.id); syncMonth(mk); save(); render(); break;
  }
});

document.addEventListener("input", (ev)=>{
  const t = ev.target;
  if (t.id === "in-paie"){ document.getElementById("preview").innerHTML = previewPlan(num(t.value)); return; }
  if (t.id === "in-pct"){ S.cfg.epargnePct = Number(t.value); const mk = monthKey(today()); if (S.months[mk] && !S.months[mk].vire) S.months[mk].pct = S.cfg.epargnePct; document.getElementById("pct-val").textContent = t.value+" %"; save(); return; }
  if (t.dataset.fx){ const f = S.cfg.fixes.find(x=>x.id===t.dataset.fx); if (f){ f[t.dataset.k] = t.dataset.k==="montant" ? num(t.value) : t.value; save(); } return; }
  if (t.dataset.en){ const e = S.cfg.env.find(x=>x.id===t.dataset.en); if (e){ e[t.dataset.k] = t.dataset.k==="pct" ? num(t.value) : t.value; save(); } return; }
  if (t.id === "in-fixe"){ S.cfg.epargneFixe = num(t.value); save(); return; }
  if (t.dataset.rl){ const m2 = curMonth(), l = m2.revenus.find(x=>x.id===t.dataset.rl); if (l){ if (t.dataset.k==="montant"){ l.montant = num(t.value); l.edited = true; } else l.nom = t.value; recalc(m2); save(); } return; }
  if (t.dataset.rt){ const r = S.cfg.revenus.find(x=>x.id===t.dataset.rt); if (r){ const k = t.dataset.k; r[k] = k==="montant" ? num(t.value) : k==="epargne" ? t.checked : k==="mois" ? Number(t.value) : k==="jour" ? (Math.min(31, Math.max(0, Math.round(num(t.value)))) || "") : t.value; syncMonth(monthKey(today())); save(); } return; }
  if (t.id === "rb-tot"){ S.cfg.rembTotal = num(t.value); save(); return; }
  if (t.id === "rb-mois"){ S.cfg.rembParMois = num(t.value); save(); return; }
  if (t.id === "ob-nom"){ S.cfg.objectif.nom = t.value; save(); }
  if (t.id === "ob-mt"){ S.cfg.objectif.montant = num(t.value); save(); }
  if (t.dataset.pj){ const pj = projets().find(x=>x.id===t.dataset.pj); if (pj){ pj[t.dataset.k] = t.dataset.k==="montant" ? num(t.value) : t.value; save(); } return; }
  if (t.id === "ob-date"){ S.cfg.objectif.date = t.value; save(); return; }
  if (t.id === "ob-deja"){ S.cfg.deja = num(t.value); save(); }
});
document.addEventListener("change", (ev)=>{ if (ev.target.name==="ep-mode"){ S.cfg.mode = ev.target.value; save(); render(); return; } if (tab==="reglages" && ev.target.id==="in-fixe") render(); if (tab==="revenus" && (ev.target.dataset.rl || ev.target.dataset.rt)){ render(); return; } if (ev.target.dataset.pj){ render(); return; } if (tab==="reglages" && (ev.target.dataset.en || ev.target.id==="in-pct")) render(); });

document.addEventListener("submit", (ev)=>{
  if (ev.target.id !== "f-dep") return;
  ev.preventDefault();
  const mt = num(document.getElementById("dep-mt").value);
  if (mt <= 0){ document.getElementById("dep-err").hidden = false; return; }
  S.depenses.push({ id:uid(), date:document.getElementById("dep-date").value || today(), montant:mt,
    cat:(document.querySelector('input[name=cat]:checked')||{}).value || S.cfg.env[0].id,
    note:document.getElementById("dep-note").value.trim(), carte:document.getElementById("dep-carte").checked });
  save(); closeSheet(); render(); toast("Dépense ajoutée");
});
document.addEventListener("keydown", (ev)=>{ if (ev.key==="Escape" && !document.getElementById("overlay").hidden) closeSheet(); });

syncMonth(monthKey(today())); save();
render();

/* ---------- sauvegarde en ligne (liée au compte Claude) ---------- */
(async function connectCloud(){
  if (!window.claude){ setSync("device"); return; }
  setSync("wait");
  try {
    const db = await window.claude?.use?.("db");
    const user = await window.claude?.use?.("user");
    const uid = user ? await user.id() : null;
    if (!db || !uid){ setSync("local"); return; }
    const ref = db.collection("data/users/" + uid).doc("cap-epargne");
    const snap = await Promise.race([ref.get(), new Promise((_, rej)=>setTimeout(()=>rej({code:"timeout"}), 10000))]);
    if (snap.exists){
      const d = snap.data();
      try { const st = JSON.parse(d.state); if (st && st.cfg){ S = st; try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} } } catch(e){}
      cloudRef = ref; setSync("ok");
      syncMonth(monthKey(today())); render();
    } else {
      cloudRef = ref; await cloudSave();
    }
  } catch(e){ setSync("err"); }
})();
</script>
